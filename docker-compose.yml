services:
  web:
    build: .
    restart: unless-stopped
    environment:
      # Set this to the real origin before the first deploy: it is what the
      # sitemap and robots.txt advertise, and a sitemap full of localhost URLs
      # submitted to Google is worse than no sitemap.
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:?set SITE_URL in .env}
    ports:
      - "127.0.0.1:3200:3000"
    # A scan holds a browser open. Without a ceiling one busy minute competes
    # with the FicAtlas database on the same host.
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
